name: verify

# 渲染全部模板（linux / darwin × cn / official）并校验 dsync.toml。
# dsync-cli 是公开仓库，安装 dsync 不需要任何 secret。
on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 dsync
        run: |
          set -euo pipefail
          # 先下载再执行（不用 curl | sh：管道中 curl 失败会被吞掉，后续步骤才报 dsync: command not found）
          curl -fsSL -o "$RUNNER_TEMP/install-dsync.sh" \
            https://raw.githubusercontent.com/Lin-Ya/dsync-cli/main/install/install.sh
          sh "$RUNNER_TEMP/install-dsync.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: 安装 chezmoi
        run: BINDIR="$HOME/.local/bin" sh -c "$(curl -fsLS get.chezmoi.io)"
      - name: dsync verify
        run: dsync verify --source .
